<!DOCTYPE html>
<html lang="fr">

<!--This code creates the home page of a website with a navigation menu. It dynamically displays a grid of artist images that link to their detailed pages. The style and interactions are managed by CSS and JavaScript files. -->
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accueil</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/page.css" />
</head>

<body>
    <nav class="top-nav">
        <a href="/">Accueil</a>
        <a href="/artistes">Artistes</a>
        <a href="/map">Map</a>
        <a href="/contact">Contact</a>
    </nav>

    <main>
        <h1>Accueil</h1>
        <section class="grid-container">
            {{ range . }}
            <a href="http://localhost:8080/artistes?id={{.ID}}">
                <button class="grid-btn">
                    <img src={{.Image}} alt="Italian Trulli" class="grid-btn">
                </button>
            </a>
            {{end}}
        </section>
    </main>

    <script src="/templates/js/sidebar.js" defer></script>
</body>

</html>

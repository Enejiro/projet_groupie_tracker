<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accueil</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/page.css" />
</head>

<body>
    <nav class="top-nav">
        <a href="/">Accueil</a>
        <a href="/artistes">Artistes</a>
        <a href="/map">Map</a>
        <a href="/contact">Contact</a>
    </nav>

    <main>
        <h1>Accueil</h1>

        <!-- Barre de recherche ajoutée -->
        <input type="text" id="searchInput" placeholder="Rechercher un artiste..." />

        <section class="grid-container">
            {{ range . }}
            <a href="http://localhost:8080/artistes?id={{.ID}}" class="grid-item" data-name="{{.Name}}">
                <button class="grid-btn">
                    <img src="{{.Image}}" alt="{{.Name}}" class="grid-btn">
                </button>
            </a>
            {{end}}
        </section>
    </main>

    <script>
        // Script de filtrage
        document.addEventListener("DOMContentLoaded", () => {
            const searchInput = document.getElementById("searchInput");
            const gridItems = document.querySelectorAll(".grid-item");

            searchInput.addEventListener("input", () => {
                const query = searchInput.value.toLowerCase();
                gridItems.forEach(item => {
                    const name = item.dataset.name.toLowerCase();
                    item.style.display = name.includes(query) ? "" : "none";
                });
            });
        });
    </script>

    <script src="/templates/js/sidebar.js" defer></script>
</body>

</html>
